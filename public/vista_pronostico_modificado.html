<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOFEL — Vista General</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0a0d14; --bg2: #111520; --bg3: #171c2a;
      --card: #1a2035; --border: #232d47;
      --accent: #e8a020; --accent2: #f0c050;
      --text: #e2e8f0; --text2: #8a96b0; --text3: #505870;
      --green: #1ebd63; --red: #d94032;
      --green-bg: rgba(30,189,99,0.12); --red-bg: rgba(217,64,50,0.12);
      --color1:#FAE605;
      --color2:#0FF7EB;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--text); }

    /* ─── LAYOUT ─────────────────────────────────── */
    .layout {
      height: 100vh;
      display: grid;
      grid-template-rows: 65% 25% 10%;
      grid-template-columns: 30% 70%;
      grid-template-areas:
        "s1 s2"
        "s3 s4"
        "s5 s5";
    }

    .sec { overflow: hidden; position: relative; }

    /* ─── SECCIÓN 1: Lista de videos ──────────────── */
    .sec1 {
      grid-area: s1;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .sec1 .head {
      padding: 0.7rem 1rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem; font-weight: 700;
      letter-spacing: 2px; color: var(--accent);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .video-list { flex: 1; overflow-y: auto; }
    .video-list::-webkit-scrollbar { width: 4px; }
    .video-list::-webkit-scrollbar-track { background: transparent; }
    .video-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .video-item {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(35,45,71,0.5);
      transition: all 0.15s;
    }
    .video-item:hover { background: rgba(232,160,32,0.06); }
    .video-item.active { background: rgba(232,160,32,0.12); border-left: 3px solid var(--accent); }
    .video-item .num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.2rem; font-weight: 700;
      color: var(--accent); min-width: 2rem; text-align: center;
    }
    .video-item .info .name { font-size: 0.88rem; font-weight: 500; color: var(--text); line-height: 1.3; }
    .video-item .info .status { font-size: 0.72rem; color: var(--text3); margin-top: 0.15rem; }
    .video-item .playing-indicator {
      margin-left: auto;
      display: flex; gap: 2px; align-items: flex-end; height: 16px;
    }
    .bar { width: 3px; border-radius: 2px; background: var(--accent); }
    .bar:nth-child(1) { animation: bars 0.8s ease-in-out infinite; height: 8px; }
    .bar:nth-child(2) { animation: bars 0.8s ease-in-out 0.2s infinite; height: 14px; }
    .bar:nth-child(3) { animation: bars 0.8s ease-in-out 0.4s infinite; height: 10px; }
    @keyframes bars { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }

    /* ─── SECCIÓN 2: Video player ─────────────────── */
    .sec2 {
      grid-area: s2;
      background: #000;
      position: relative;
      border-bottom: 1px solid var(--border);
    }
    .sec2 video {
      width: 100%; height: 100%; object-fit: contain;
      display: block;
    }
    .video-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,13,20,0.95);
      flex-direction: column; gap: 1rem;
      pointer-events: none;
    }
    .video-overlay.hidden { display: none; }
    .video-overlay .ov-icon { font-size: 3rem; opacity: 0.4; }
    .video-overlay .ov-text { font-family:'Barlow Condensed',sans-serif; font-size:1.2rem; letter-spacing:2px; color:var(--text3); }

    /* ─── SECCIÓN 3: Folios pendientes ────────────── */
    .sec3 {
      grid-area: s3;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .sec3 .head {
      padding: 0.5rem 0.8rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: 2px; color: var(--accent);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
    }
    .folio-list {
      flex: 1; overflow-y: auto;
    }
    .folio-list::-webkit-scrollbar { width: 3px; }
    .folio-list::-webkit-scrollbar-thumb { background: var(--border); }
    .folio-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.4rem 0.8rem;
      border-bottom: 1px solid rgba(35,45,71,0.4);
      font-size: 0.82rem;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
    .folio-row .fn {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 700; color: var(--accent);
    }
    .folio-row .ft { color: var(--text2); font-size: 0.78rem; }

    /* ─── SECCIÓN 4: Terminales matrix ────────────── */
    .sec4 {
      grid-area: s4;
      background: var(--bg3);
      display: flex; flex-direction: column;
    }
    .sec4 .head {
      padding: 0.5rem 1rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: 2px; color: var(--accent);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    .terminals-grid {
      flex: 1; display: flex;
      align-items: center; padding: 0 1rem;
      overflow-x: auto; gap: 0.6rem;
    }
    .terminal-cell {
      min-width: 100px; text-align: center;
      border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .terminal-cell .t-name {
      padding: 0.4rem 0.6rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem; font-weight: 700;
      letter-spacing: 1px;
      transition: background 0.3s;
    }
    .terminal-cell .t-name.online { background: var(--green-bg); color: var(--green); }
    .terminal-cell .t-name.offline { background: var(--red-bg); color: var(--red); }
    .terminal-cell .t-folio {
      padding: 0.5rem 0.6rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem; font-weight: 900;
      color: var(--text2); background: var(--card);
      min-height: 42px; display: flex;
      align-items: center; justify-content: center;
    }
    .terminal-cell .t-folio.active { color: var(--accent2); }

    /* ─── SECCIÓN 5: Footer ───────────────────────── */
    .sec5 {
      grid-area: s5;
      background: var(--bg2);
      border-top: 2px solid var(--accent);
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      gap: 1rem;
    }
    .footer-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 600;
      letter-spacing: 2px; color: var(--accent);
      white-space: nowrap;
    }
    .footer-weather {
      flex: 1; overflow: hidden;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .weather-label {
      font-size: 1.1rem; color: var(--color2);
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 1px; white-space: nowrap;
    }
    .weather-ticker {
      flex: 1; overflow: hidden;
      position: relative; height: 24px;
    }
    .ticker-inner {
      position: absolute; white-space: nowrap;
      font-size: 1.1rem; color: var(--color1);
      animation: ticker 30s linear infinite;
      top: 50%; transform: translateY(-50%);
    }
    @keyframes ticker {
      0% { left: 100%; }
      100% { left: -200%; }
    }
    .brand-footer {
      /*font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.2rem; font-weight: 900;
      letter-spacing: 4px; color: rgba(232,160,32,0.4);
      white-space: nowrap;*/
      display: flex;
      align-items: center;
      height: 100%;
    }

      .brand-footer img {
      height: 70%;       /* Hace que el logo ocupe el alto disponible del footer */
      width: auto;        /* Mantiene la proporción original sin deformarlo */
      object-fit: contain; /* Asegura que se adapte perfectamente al contenedor */
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="layout">
  <!-- S1: Lista de videos -->
  <div class="sec sec1">
    <div class="head">📹 Videos</div>
    <div class="video-list" id="videoList">
      <div style="padding:1rem;color:var(--text3);font-size:0.85rem">Cargando videos...</div>
    </div>
  </div>

  <!-- S2: Reproductor -->
  <div class="sec sec2">
    <video id="videoPlayer" preload="auto">
      <source src="" type="video/mp4">
    </video>
    <div class="video-overlay" id="videoOverlay">
      <div class="ov-icon">📺</div>
      <div class="ov-text">Sin video seleccionado</div>
    </div>
  </div>

  <!-- S3: Folios pendientes -->
  <div class="sec sec3">
    <div class="head">🎫 Turnos en espera</div>
    <div class="folio-list" id="folioList">
      <div style="padding:1rem;color:var(--text3);font-size:0.82rem">Sin turnos pendientes</div>
    </div>
  </div>

  <!-- S4: Terminales -->
  <div class="sec sec4">
    <div class="head">💻 Terminales de Atención</div>
    <div class="terminals-grid" id="terminalsGrid">
      <div style="color:var(--text3);font-size:0.85rem">Sin terminales configuradas</div>
    </div>
  </div>

  <!-- S5: Footer -->
  <div class="sec sec5">
    <div class="footer-time" id="footerTime">--:--:--</div>
    <div class="footer-weather">
      <span class="weather-label">PRONÓSTICO:</span>
      <div class="weather-ticker">
        <div class="ticker-inner" id="weatherTicker">Cargando pronóstico del tiempo...</div>
      </div>
    </div>
    <div class="brand-footer" ><img src="/images/logo_fofel.png" alt="logo de fofel"></div>
  </div>
</div>

<script>
// ─── Estado ───
let videos = [];
let currentVideoIdx = 0;
let terminales = [];
let foliosPendientes = [];

// ─── Socket.IO ───
const socket = io();
socket.on('terminales_update', data => { terminales = data; renderTerminales(); });
socket.on('folios_update', data => { foliosPendientes = data.filter(f => f.status_atencion < 2); renderFolios(); });
socket.on('nuevo_folio', data => {
  if (data.status_atencion < 2) {
    foliosPendientes.push(data);
    renderFolios();
  }
});

// ─── VIDEO ───
const player = document.getElementById('videoPlayer');

async function loadVideos() {
  videos = await fetch('/api/videos').then(r => r.json());
  renderVideoList();
  if (videos.length) playVideo(0);
}

function renderVideoList() {
  const list = document.getElementById('videoList');
  if (!videos.length) { list.innerHTML = '<div style="padding:1rem;color:var(--text3);font-size:0.85rem">Sin videos en catálogo</div>'; return; }
  list.innerHTML = videos.map((v, i) => `
    <div class="video-item ${i === currentVideoIdx ? 'active' : ''}" id="vi-${i}" onclick="playVideo(${i})">
      <div class="num">${v.numero}</div>
      <div class="info">
        <div class="name">${v.nombre}</div>
        <div class="status">${v.ruta.split('/').pop()}</div>
      </div>
      ${i === currentVideoIdx ? '<div class="playing-indicator"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>' : ''}
    </div>`).join('');
}

function playVideo(idx) {
  if (!videos.length) return;
  currentVideoIdx = idx;
  const v = videos[idx];
  player.src = v.ruta;
  player.load();
  player.play().catch(() => {});
  document.getElementById('videoOverlay').classList.add('hidden');
  renderVideoList();
}

player.addEventListener('ended', () => {
  const next = (currentVideoIdx + 1) % videos.length;
  playVideo(next);
});

player.addEventListener('error', () => {
  setTimeout(() => {
    const next = (currentVideoIdx + 1) % videos.length;
    playVideo(next);
  }, 2000);
});

// Controls — prevent fullscreen double click
player.addEventListener('dblclick', e => { e.preventDefault(); e.stopPropagation(); });

// ─── FOLIOS ───
async function loadFolios() {
  const all = await fetch('/api/folios/pendientes').then(r => r.json());
  foliosPendientes = all;
  renderFolios();
}

function renderFolios() {
  const list = document.getElementById('folioList');
  const pending = foliosPendientes.filter(f => f.status_atencion < 2);
  if (!pending.length) {
    list.innerHTML = '<div style="padding:1rem;color:var(--text3);font-size:0.82rem">Sin turnos pendientes</div>';
    return;
  }
  list.innerHTML = pending.map(f => {
    const termName = f.terminal_nombre || 'Por atender';
    const isPorAtender = !f.terminal_id;
    return `<div class="folio-row">
      <span class="fn">${String(f.folio).padStart(4,'0')}</span>
      <span class="ft">${isPorAtender ? '⏳ Por atender' : '🔧 '+termName}</span>
    </div>`;
  }).join('');
}

// ─── TERMINALES ───
async function loadTerminales() {
  terminales = await fetch('/api/terminales').then(r => r.json());
  renderTerminales();
}

function renderTerminales() {
  const grid = document.getElementById('terminalsGrid');
  if (!terminales.length) {
    grid.innerHTML = '<div style="color:var(--text3);font-size:0.85rem">Sin terminales configuradas</div>';
    return;
  }
  grid.innerHTML = terminales.map(t => {
    const isOnline = t.status === 'online';
    const folio = t.folio_actual ? String(t.folio_actual).padStart(4,'0') : '';
    return `<div class="terminal-cell">
      <div class="t-name ${isOnline ? 'online' : 'offline'}">${t.nombre}</div>
      <div class="t-folio ${isOnline ? 'active' : ''}">${isOnline ? folio : ''}</div>
    </div>`;
  }).join('');
}

// ─── RELOJ ───
function updateClock() {
  const now = new Date();
  document.getElementById('footerTime').textContent =
    now.toLocaleDateString('es-MX', {weekday:'short', day:'2-digit', month:'short'}).toUpperCase()
    + '  ' + now.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ─── CLIMA (pronóstico genérico con Open-Meteo) ───
async function loadWeather() {
  try {
    // Intenta geolocalización o usa default (Veracruz, MX)
    const lat = 19.208333, lon = -96.15;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,windspeed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3`;
    const d = await fetch(url).then(r => r.json());
    const codes = {0:'Despejado',1:'Mayormente despejado',2:'Parcialmente nublado',3:'Nublado',45:'Niebla',48:'Niebla con escarcha',51:'Llovizna ligera',53:'Llovizna moderada',61:'Lluvia ligera',63:'Lluvia moderada',65:'Lluvia intensa',80:'Chubascos ligeros',81:'Chubascos moderados',95:'Tormenta'};
    const cur = d.current;
    const daily = d.daily;
    const codeLabel = codes[cur.weathercode] || 'Variable';
    const ticker = `🌡 ${cur.temperature_2m}°C — ${codeLabel} | 💨 ${cur.windspeed_10m} km/h | ` +
      `Hoy: ${daily.temperature_2m_min[0]}°–${daily.temperature_2m_max[0]}°C | ` +
      `Mañana: ${daily.temperature_2m_min[1]}°–${daily.temperature_2m_max[1]}°C | ` +
      `Pasado: ${daily.temperature_2m_min[2]}°–${daily.temperature_2m_max[2]}°C`;
    document.getElementById('weatherTicker').textContent = ticker + '          ' + ticker;
  } catch(e) {
    document.getElementById('weatherTicker').textContent = 'Pronóstico del tiempo no disponible';
  }
}

// ─── INIT ───
loadVideos();
loadFolios();
loadTerminales();
loadWeather();
setInterval(loadWeather, 600000);
</script>
</body>
</html>
